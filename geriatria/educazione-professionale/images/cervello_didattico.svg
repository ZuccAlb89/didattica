<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Schema didattico dell'anatomia cerebrale</title>
<desc id="desc">Vista laterale schematica del cervello con lobi frontale, parietale, temporale e occipitale, corteccia prefrontale, ippocampo, cervelletto e tronco encefalico.</desc>
<rect width="1200" height="780" fill="white"/>
<style>
  .lbl{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#111}
  .small{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#222}
  .foot{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#444}
  .lead{stroke:#222;stroke-width:3;fill:none}
  .dot{fill:#111}
</style>

<!-- brain silhouette, simplified lateral view -->
<path d="M250 230 C260 120 380 70 520 95 C600 55 720 75 780 145 C900 115 1010 190 1025 310 C1045 400 985 470 900 490 C820 535 700 545 590 520 C480 545 360 520 300 455 C235 400 220 310 250 230Z" fill="#f3efe8" stroke="#333" stroke-width="4"/>

<!-- frontal lobe -->
<path d="M250 230 C260 120 380 70 520 95 C575 105 610 150 600 225 C590 305 545 365 470 390 C385 410 300 375 270 315 C250 280 242 255 250 230Z" fill="#a9d3f5" stroke="#3778a8" stroke-width="3"/>
<!-- prefrontal -->
<path d="M265 245 C270 180 325 130 390 125 C355 190 345 270 370 335 C320 335 280 300 265 245Z" fill="none" stroke="#2c70a2" stroke-width="4" stroke-dasharray="10 8"/>

<!-- parietal lobe -->
<path d="M520 95 C615 62 735 75 800 150 C830 190 830 260 800 315 C760 350 690 360 600 330 C620 250 620 160 600 110Z" fill="#b7dc8d" stroke="#6b9e3b" stroke-width="3"/>

<!-- occipital lobe -->
<path d="M800 150 C900 120 1005 195 1025 310 C1040 385 1005 440 935 470 C900 420 875 355 875 285 C875 220 850 180 800 150Z" fill="#ef9b8f" stroke="#b65349" stroke-width="3"/>

<!-- temporal lobe -->
<path d="M470 390 C520 320 625 300 760 320 C850 330 905 365 935 470 C850 520 730 545 590 520 C500 525 430 485 430 440 C430 420 445 402 470 390Z" fill="#f5be82" stroke="#c9772e" stroke-width="3"/>

<!-- medial temporal dashed region and hippocampus -->
<ellipse cx="670" cy="420" rx="150" ry="65" fill="none" stroke="#a85a1f" stroke-width="4" stroke-dasharray="11 8"/>
<path d="M575 435 C610 390 675 380 730 398 C760 408 772 432 755 448 C725 475 665 480 615 463 C592 455 575 447 575 435Z" fill="#9a78be" stroke="#6b4d8d" stroke-width="3"/>

<!-- cerebellum -->
<ellipse cx="865" cy="545" rx="105" ry="78" fill="#b3a0c7" stroke="#75638a" stroke-width="3"/>
<path d="M790 520 Q865 485 940 520 M785 540 Q865 505 945 540 M790 560 Q865 525 940 560 M805 580 Q865 550 925 580" stroke="#78668d" stroke-width="2" fill="none"/>

<!-- brainstem -->
<path d="M760 485 C780 500 795 525 795 555 L790 655 C790 685 760 700 738 680 L742 555 C742 520 748 500 760 485Z" fill="#d4c2aa" stroke="#88745d" stroke-width="3"/>

<!-- labels -->
<rect x="55" y="85" rx="12" ry="12" width="230" height="58" fill="#dceefe" stroke="#3778a8" stroke-width="2"/>
<text x="78" y="123" class="lbl">Lobo frontale</text>
<path d="M285 115 L380 165" class="lead"/><circle cx="380" cy="165" r="6" class="dot"/>

<rect x="35" y="240" rx="12" ry="12" width="230" height="82" fill="#dceefe" stroke="#3778a8" stroke-width="2"/>
<text x="58" y="275" class="lbl">Corteccia</text><text x="58" y="307" class="lbl">prefrontale</text>
<path d="M265 280 L335 260" class="lead"/><circle cx="335" cy="260" r="6" class="dot"/>

<rect x="655" y="48" rx="12" ry="12" width="240" height="58" fill="#e2f2d0" stroke="#6b9e3b" stroke-width="2"/>
<text x="678" y="86" class="lbl">Lobo parietale</text>
<path d="M775 106 L735 170" class="lead"/><circle cx="735" cy="170" r="6" class="dot"/>

<rect x="935" y="240" rx="12" ry="12" width="230" height="58" fill="#fde2de" stroke="#b65349" stroke-width="2"/>
<text x="958" y="278" class="lbl">Lobo occipitale</text>
<path d="M935 270 L950 325" class="lead"/><circle cx="950" cy="325" r="6" class="dot"/>

<rect x="350" y="565" rx="12" ry="12" width="240" height="58" fill="#fde5c8" stroke="#c9772e" stroke-width="2"/>
<text x="375" y="603" class="lbl">Lobo temporale</text>
<path d="M485 565 L520 475" class="lead"/><circle cx="520" cy="475" r="6" class="dot"/>

<rect x="760" y="380" rx="10" ry="10" width="260" height="48" fill="#f9ead9" stroke="#a85a1f" stroke-width="2"/>
<text x="780" y="412" class="small" font-weight="700">Aree temporali mediali</text>
<path d="M760 405 L725 420" class="lead"/><circle cx="725" cy="420" r="6" class="dot"/>

<rect x="925" y="555" rx="12" ry="12" width="210" height="58" fill="#ece4f4" stroke="#75638a" stroke-width="2"/>
<text x="950" y="593" class="lbl">Cervelletto</text>
<path d="M925 583 L885 565" class="lead"/><circle cx="885" cy="565" r="6" class="dot"/>

<rect x="805" y="650" rx="12" ry="12" width="250" height="58" fill="#eee7df" stroke="#88745d" stroke-width="2"/>
<text x="828" y="688" class="lbl">Tronco encefalico</text>
<path d="M805 678 L765 635" class="lead"/><circle cx="765" cy="635" r="6" class="dot"/>

<!-- hippocampus inset -->
<rect x="45" y="500" width="270" height="205" rx="18" ry="18" fill="#fff" stroke="#6b4d8d" stroke-width="4"/>
<rect x="85" y="515" width="185" height="48" rx="10" ry="10" fill="#e9dcf6"/>
<text x="112" y="548" class="lbl">Ippocampo</text>
<path d="M105 620 C135 580 195 575 235 600 C255 614 252 640 230 651 C190 670 130 662 105 640 C95 632 96 622 105 620Z" fill="#9a78be" stroke="#6b4d8d" stroke-width="3"/>
<circle cx="175" cy="625" r="6" class="dot"/>
<path d="M175 625 L165 562" class="lead"/>
<text x="72" y="682" class="small">Vista mediale semplificata</text>
<path d="M315 610 C430 595 500 520 610 445" fill="none" stroke="#6b4d8d" stroke-width="4" marker-end="url(#arr)"/>

<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#6b4d8d"/>
</marker>
</defs>

<text x="360" y="755" class="foot">Schema semplificato: le funzioni emergono da reti distribuite, non da singole aree isolate.</text>
</svg>